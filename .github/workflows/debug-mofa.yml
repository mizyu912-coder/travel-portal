name: debug-mofa
on: { workflow_dispatch: {} }
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -sSL -A "Mozilla/5.0" -o out/th.html https://www.anzen.mofa.go.jp/info/pcinfectionspothazardinfo_007.html
          curl -sSL -A "Mozilla/5.0" -o out/kiken.html https://www.anzen.mofa.go.jp/kiken_list.html
          curl -sSL -A "Mozilla/5.0" -o out/inf.html https://www.anzen.mofa.go.jp/info/search/pcinfectioninfo.html
          ls -la out
          echo "=== th: script src / url-like"; grep -oiE '(src|href)="[^"]*\.(js|json|xml)[^"]*"|[a-z0-9_/.-]+\.(json|xml)' out/th.html | sort -u | head -40
          echo "=== th: lines with レベル or 危険情報"; grep -nE 'レベル|危険情報|ajax|fetch\(|getJSON|\$\.get' out/th.html | cut -c1-300 | head -60
          echo "=== th: body text head"; sed -e 's/<[^>]*>//g' out/th.html | grep -v '^\s*$' | head -120 | cut -c1-200
