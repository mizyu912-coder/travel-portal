# 毎日 9:00（日本時間）に、危険情報の確認・動画の収集・サイトの公開を自動で行う。
# 動画の検索は1日85回までで、検索した日が古い国・都市から順に回る（各国・都市はおよそ週1回検索される）
name: weekly-update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      places:
        description: '動画を集める国・都市のID（空欄なら全部。例：japan tokyo kyoto）'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'scripts/**']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency: { group: weekly-update, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: 危険情報の確認
        id: safety
        if: github.event_name != 'push'
        run: node scripts/check-safety.mjs

      - name: 危険情報が変わったら Issue で知らせる
        if: steps.safety.outputs.changed == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create --title "危険情報が変わりました（$(date +%Y-%m-%d)）" --body-file safety-report.md

      - name: YouTube 動画の収集
        if: github.event_name != 'push' && env.YOUTUBE_API_KEY != ''
        env: { PLACES: '${{ inputs.places }}' }
        run: node scripts/collect-videos.mjs $PLACES

      - name: 写真の取得（Wikimedia Commons、足りない国だけ）
        run: node scripts/fetch-images.mjs

      - name: ブログ・記事リンクの確認
        run: node scripts/check-links.mjs

      - name: データの更新を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "自動更新：危険情報と動画データ（$(date +%Y-%m-%d)）"
          # 途中で別の更新が入っていたら取り込んでから送る（同じファイルはこの実行の結果を優先）
          git pull --rebase -X theirs -q origin main
          git push

      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
