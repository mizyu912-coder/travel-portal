# 毎週月曜 9:00（日本時間）に、危険情報の確認・動画の収集・サイトの公開を自動で行う
name: weekly-update
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'scripts/**']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency: { group: weekly-update, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: 危険情報の確認
        id: safety
        if: github.event_name != 'push'
        run: node scripts/check-safety.mjs

      - name: 危険情報が変わったら Issue で知らせる
        if: steps.safety.outputs.changed == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create --title "危険情報が変わりました（$(date +%Y-%m-%d)）" --body-file safety-report.md

      - name: YouTube 動画の収集
        if: github.event_name != 'push' && env.YOUTUBE_API_KEY != ''
        run: node scripts/collect-videos.mjs

      - name: 動画の概要文をAIで作成（Gemini API）
        if: github.event_name != 'push'
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: node scripts/summarize-videos.mjs

      - name: ブログ・記事リンクの確認
        run: node scripts/check-links.mjs

      - name: データの更新を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git pull --rebase -q origin main || true
          git diff --cached --quiet || git commit -m "自動更新：危険情報と動画データ（$(date +%Y-%m-%d)）"
          git push

      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
