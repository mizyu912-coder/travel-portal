name: dns-check
on: push
permissions:
  pages: write
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api -X PUT repos/${{ github.repository }}/pages -f cname=triptheater.com && echo SETOK || echo SETFAIL
          gh api repos/${{ github.repository }}/pages | jq -c '{cname,https_enforced,status,html_url}'
