name: dns-check
on: push
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "triptheater.com&type=A" "triptheater.com&type=NS" "www.triptheater.com&type=CNAME"; do echo "== $q"; curl -s "https://dns.google/resolve?name=$q" | jq -c '[.Status, (.Answer // .Authority // [] | map(.data))]'; done
          echo "== local"; getent hosts triptheater.com || true; getent hosts www.triptheater.com || true
