name: dns-check
on: push
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=triptheater.com&type=A" | jq -c .
          curl -s "https://rdap.verisign.com/com/v1/domain/triptheater.com" | jq -c '{ns:[.nameservers[]?.ldhName], st:.status, ev:[.events[]?|{(.eventAction):.eventDate}], reg:[.entities[]?|select(.roles|index("registrar"))|.vcardArray[1][1][3]]}'
